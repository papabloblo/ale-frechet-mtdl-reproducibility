# Sweep definition for ALE–Fréchet
# Each combination is expanded into an independent method YAML

baselines: ['ale_frechet', 'single_task_mlp', 'hard', 'soft', 'mmoe', 'crossstitch', 'ple', 'mtan']
seeds: [0, 1, 2, 3, 4]
similarity:
  update_every: [null, 10]
  keep_epochs: [null, 10]

regularization:
  l2: [1e-2]

optim:
  lr: [1e-3]

# Optional constraints / conventions
constraints:
  tie_ale_and_similarity_updates: true
